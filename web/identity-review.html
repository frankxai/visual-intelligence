<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Identity review · VIS</title>
<style>
:root{color-scheme:dark;background:#101316;color:#f5f3ed;font:16px/1.5 "Instrument Sans",system-ui,sans-serif}*{box-sizing:border-box}body{max-width:1050px;margin:auto;padding:clamp(1rem,4vw,3.5rem)}header{border-bottom:1px solid #404442;padding-bottom:1.4rem}a{color:#a6d7c3}h1{font-size:clamp(2.2rem,5vw,4rem);line-height:1.05;letter-spacing:-.05em;margin:.4em 0}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}form,.card{background:#191e20;border:1px solid #434a47;border-radius:12px;padding:1.2rem;margin-top:1rem;min-width:0}label{display:block;margin:.6rem 0}input,select,button{font:inherit;color:inherit;background:#252c2b;border:1px solid #606e66;border-radius:5px;padding:.6rem;width:100%}button{background:#bae4c7;color:#142d22;cursor:pointer;font-weight:700}.hint,dt{color:#b9c1b9}dd{margin:0 0 .65rem;overflow-wrap:anywhere}#state{font-weight:700;color:#c7e4d1}[hidden]{display:none!important}.pane{max-width:100%;max-height:19rem;display:block;margin:auto}input[type=file]{font-size:.85rem}h2{font-size:1.25rem}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e6b969;outline-offset:3px}@media(max-width:660px){.grid{grid-template-columns:1fr}}
</style><header><a href="/">← VIS Library</a><h1>Identity review</h1><p>Resolve a master, then compare the files selected for a placement.</p><a href="/identity-decisions">Review a placement decision →</a></header>
<div class="grid"><form id="query"><label>Identity ID<input name="identity_id" list="ids" value="agentic-income" required><datalist id="ids"><option>agentic-income</option><option>starlight</option><option>arcanea</option><option>gencreator</option><option>frankx</option><option>host.frank</option><option>custom.nilo</option><option>custom.brio</option><option>custom.riff</option><option>starlight.queen.study01</option></datalist></label><label>Placement<select id="placement"><option>Website header</option><option>Starlight lab header</option><option>Slide title</option><option>Newsletter masthead</option><option>Avatar</option><option>Private character folio</option></select></label><button>Resolve master</button></form>
<section class="card" aria-live="polite"><h2>Authority record</h2><div id="state">Awaiting selection</div><dl id="record"></dl></section></div>
<div class="grid"><section class="card"><h2>Registered original</h2><label>Verify another copy of the master<input type="file" id="original" accept="image/*" disabled></label><p id="original-note"></p><img class="pane" id="original-view" alt="" hidden></section>
<section class="card"><h2>Placement candidate</h2><label>Choose the proposed asset<input type="file" id="candidate" accept="image/*" disabled></label><p aria-live="polite" id="candidate-note"></p><img class="pane" id="candidate-view" alt="" hidden></section></div>
<script type="module">
const el=id=>document.getElementById(id), form=el('query')
const placements=[['logo.primary','site header','website'],['site.logo.color','site header','starlightintelligence.ai'],['logo.primary','deck title slide','slides'],['logo.primary','newsletter masthead','newsletter'],['logo.mark','avatar','social'],['reference-sheet','identity reference','internal']]
let receipt=null, generation=0
const urls={}
const identity=form.elements.identity_id
identity.addEventListener('input',()=>{
  if (['host.frank','custom.nilo','custom.brio','custom.riff','starlight.queen.study01'].includes(identity.value)) el('placement').selectedIndex=5
  else if(identity.value==='starlight') el('placement').selectedIndex=1
  else if(identity.value==='agentic-income') el('placement').selectedIndex=0
})
function clearFile(id){if(urls[id])URL.revokeObjectURL(urls[id]);el(id+'-view').removeAttribute('src');el(id+'-view').hidden=true;el(id+'-note').textContent='';el(id).value='';el(id).disabled=true}
function reset(){generation++;receipt=null;el('record').replaceChildren();el('state').textContent='Awaiting resolution';for(const id of ['original','candidate'])clearFile(id)}
form.addEventListener('input', reset)
form.onsubmit=async e=>{e.preventDefault();reset();const n=generation;const [variant,intended_use,channel]=placements[el('placement').selectedIndex]
try{const p=new URLSearchParams({identity_id:form.elements.identity_id.value,variant,intended_use,channel,required_approval:'identity'});const res=await fetch('/api/identity/resolve?'+p);const r=await res.json();if(n!==generation)return;
if(!res.ok||r.status!=='resolved'){el('state').textContent='Unresolved · '+(r.reason||'Unavailable');return}
receipt=r;el('state').textContent='Verified reference';for(const [k,v] of Object.entries({'Identity':r.identity_id,'Source':r.source_authority,'Version':r.approved_version,'Canonical asset':r.asset_id,'Approval':r.approval_state,'SHA-256':r.sha256,'Permitted use':r.rights.permitted_uses.join(', '),'Release':'Separate approval required'})){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;el('record').append(dt,dd)}for(const id of ['original','candidate'])el(id).disabled=false
const preview=await fetch('/api/identity/preview',{method:'POST',headers:{'content-type':'application/json','x-vis-operator':'1'},body:JSON.stringify({...Object.fromEntries(p),expected_sha256:r.sha256,expected_version:r.approved_version})})
if(preview.ok){const blob=await preview.blob();if(n!==generation||el('original').files.length)return;urls.original=URL.createObjectURL(blob);const img=el('original-view');img.src=urls.original;img.alt='Verified '+r.identity_id+' reference';img.hidden=false;el('original-note').textContent='Preview from the verified original'}
}catch{if(n===generation)el('state').textContent='Unresolved · authority unavailable'}}
for(const id of ['original','candidate'])el(id).onchange=async()=>{const f=el(id).files[0],r=receipt,n=generation;const img=el(id+'-view');img.hidden=true;img.removeAttribute('src');if(urls[id])URL.revokeObjectURL(urls[id]);if(!r||!f)return;
try{const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await f.arrayBuffer())),b=>b.toString(16).padStart(2,'0')).join('');if(generation!==n||el(id).files[0]!==f)return;const exact=hash===r.sha256;el(id+'-note').textContent=exact?'Exact master bytes':(id==='original'?'Blocked · original differs':'Different bytes · review required')
if(exact||(id==='candidate'&&['image/png','image/jpeg','image/webp'].includes(f.type))){urls[id]=URL.createObjectURL(f);img.src=urls[id];img.alt=id==='original'?'Verified reference for '+r.identity_id:'Candidate file for comparison';img.hidden=false}
}catch{el(id+'-note').textContent='File verification failed'}}
</script></html>
