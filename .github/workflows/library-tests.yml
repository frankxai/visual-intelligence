name: Library tests

on:
  pull_request:
    branches: [main, codex/visual-intelligence-os-v02]
  push:
    branches: [claude/library-2026-09-30]

permissions:
  contents: read

jobs:
  test:
    name: Lint and node --test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
          cache: true
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Syntax check
        run: |
          for f in bin/vis.mjs core/vis-core.mjs core/vis-library.mjs core/vis-storage.mjs \
                   web/vis-library-server.mjs web/vis-dashboard.mjs mcp/vis-mcp-server.mjs \
                   workers/vis-media/src/index.js; do node --check "$f"; done
      - name: Tests
        run: node --test "tests/**/*.test.mjs"
